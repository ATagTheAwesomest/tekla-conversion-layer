services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Only reachable from this machine and from the tailscale container. No port is opened to the network.
    ports:
      - "127.0.0.1:8080:8080"

  # Tailscale Funnel: publishes the API at https://<TS_HOSTNAME>.<tailnet>.ts.net with a real
  # certificate. The container only makes outbound connections. Needs TS_AUTHKEY in .env.
  # Start with: docker compose --profile tunnel up -d
  tailscale:
    image: tailscale/tailscale:v1.104.1
    profiles: ["tunnel"]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-powerfab-bridge}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-powerfab-bridge}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - api

volumes:
  tailscale-state:
